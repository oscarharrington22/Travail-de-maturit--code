{% extends 'base.html' %}
{% block content %}
    <h2>Recherche de répétiteurs</h2>

<form method="get">
    {{ form.as_p }}
    <button type="submit">Rechercher</button>
</form>

<hr>

{% for repetiteur in repetiteurs %}

    <h3>{{ repetiteur.username }}</h3>

    <p>Ville : {{ repetiteur.ville }}<br>Tarif : {{ repetiteur.tarif }}</p>

{% endfor %}
{% endblock content %}
