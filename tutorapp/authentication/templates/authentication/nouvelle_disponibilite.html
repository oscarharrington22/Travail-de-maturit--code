{% extends 'base.html' %}

{% block content %}

    <head>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    </head>
    <div class="w3-container w3-margin-top">
        <div class="w3-card-4 w3-white w3-round-xlarge w3-padding w3-left-align" style="width: 45%; margin: auto;">
            <h2 class="w3-center">Nouveau créneau</h2>
            <form method="post" class="w3-padding">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="w3-button w3-indigo w3-round-xxlarge w3-hover-blue">Créer</button>
            </form>
        </div>
        <div class="w3-container w3-center w3-padding-16">
            <a href="{% url 'mes_disponibilites' %}" class="w3-button w3-blue-gray w3-round-xxlarge w3-hover">Retour</a>
        </div>
        
    </div>

{% endblock content %}
